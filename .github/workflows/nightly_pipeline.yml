# nightly_pipeline.yml — batch nocturno del POC.
#
# POR QUÉ ESTO EXISTE (ver AUDIT_LEAN.md §1.5 y RUNBOOK.md): el pipeline
# necesita salida a internet hacia SEC EDGAR, openFDA, Yahoo Finance y la Ken
# French Data Library. Ningún sandbox de desarrollo de Claude Code tiene esa
# salida (política de egress de la organización). Los runners de GitHub
# Actions SÍ tienen salida a internet completa por defecto — así que el
# pipeline vive aquí, no en un sandbox de desarrollo ni en un servidor propio.
#
# Esto también encaja con el diseño: todo el sistema es un batch nocturno
# (ARCHITECTURE_LEAN.md §2.5 — la entrada nunca es antes de D+1), así que un
# cron de GitHub Actions es toda la infraestructura de orquestación que hace
# falta. Nada de Airflow, nada de un servidor siempre encendido.
#
# Requiere estos secrets del repo (ver RUNBOOK.md para cómo obtenerlos):
#   DATABASE_URL        — Postgres alojado (Neon/Supabase free tier)
#   ANTHROPIC_API_KEY    — para pipeline/analyze/event_analysis_pipeline.py (Bull/Bear/Judge)
#   EDGAR_USER_AGENT      — "Tu Nombre tu@email.com" (la SEC lo exige)

name: Nightly Pipeline

on:
  schedule:
    # TRES pasadas al día. GitHub Actions interpreta el cron SIEMPRE en UTC y
    # no entiende de horario de verano, así que las horas se eligen para que
    # sigan siendo válidas tanto en EDT (UTC-4, verano) como en EST (UTC-5,
    # invierno) — en vez de acertar en una mitad del año y fallar en la otra.
    #
    # Mercado (NYSE/NASDAQ): abre 9:30 ET, cierra 16:00 ET.
    - cron: "30 14 * * 1-5"  # TRAS LA APERTURA  — 10:30 ET en verano, 9:30 ET en invierno
    - cron: "30 21 * * 1-5"  # TRAS EL CIERRE    — 17:30 ET en verano, 16:30 ET en invierno
    - cron: "0 6 * * 2-6"    # NOCHE (la pasada completa) — 2:00 ET en verano, 1:00 ET en invierno
    #
    # Las dos pasadas intradía son LIGERAS a propósito: solo ingestan filings
    # nuevos y recalculan el análisis. Los pasos caros y frágiles (precios de
    # yfinance, cuentas XBRL de cientos de empresas) corren UNA vez al día, en
    # la pasada nocturna — ver la condición `if` de cada paso. Correrlos tres
    # veces no aportaría datos nuevos (los precios diarios no cambian
    # intradía) y triplicaría el riesgo de tropezar con los límites de
    # yfinance, que ya es la etapa más frágil del pipeline
    # (ARCHITECTURE_LEAN.md §7).
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      single_day:
        description: "Verificación manual de un solo día (YYYY-MM-DD), en vez del incremental normal"
        required: false
        default: ""
      backfill_start:
        description: "Backfill histórico — fecha inicio (YYYY-MM-DD). Ingesta el rango entero y descarga los precios del universo resultante en la MISMA corrida"
        required: false
        default: ""
      backfill_end:
        description: "Backfill histórico — fecha fin (YYYY-MM-DD). Si se omite, hasta ayer"
        required: false
        default: ""

# Nunca dos corridas a la vez. Un backfill manual de horas se solapaba con las
# pasadas programadas: dos procesos escribiendo las mismas tablas y, peor, dos
# procesos mandando los MISMOS eventos pendientes a la IA — pagando cada uno
# dos veces. La corrida nueva espera a que acabe la anterior (no la cancela:
# cancelar a mitad de un batch de la IA tira un trabajo ya pagado).
concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

jobs:
  # Job separado para correr los tests contra un Postgres efímero de servicio,
  # en cada push Y antes de cada corrida nocturna — nunca se ingiere sobre un
  # esquema no verificado.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: money_poc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run test suite (incluye T1 placebo y T2 réplica — bloqueantes)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/money_poc_test
        run: python -m pytest pipeline/tests/ -v

  ingest_and_analyze:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Aplicar schema (idempotente)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from pipeline.db.connection import get_connection, init_schema; init_schema(get_connection())"

      - name: Ingesta EDGAR (incremental — ayer y hoy, o el rango de backfill)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)
          if [ -n "${{ github.event.inputs.backfill_start }}" ]; then
            END="${{ github.event.inputs.backfill_end }}"
            [ -z "$END" ] && END="$YESTERDAY"
            echo "Backfill histórico: ${{ github.event.inputs.backfill_start }} -> $END"
            python -m pipeline.ingest.edgar_scraper --start "${{ github.event.inputs.backfill_start }}" --end "$END"
          elif [ -n "${{ github.event.inputs.single_day }}" ]; then
            python -m pipeline.ingest.edgar_scraper --start "${{ github.event.inputs.single_day }}" --end "${{ github.event.inputs.single_day }}"
          else
            # AYER y HOY, no solo ayer: con tres pasadas al día, pedir siempre
            # "ayer" haría que las dos intradía no trajeran absolutamente nada
            # nuevo. Incluir hoy es lo que permite que un 8-K presentado esta
            # mañana se detecte tras la apertura en vez de mañana de
            # madrugada. Reingestar ayer no duplica nada: upsert_events hace
            # ON CONFLICT DO NOTHING sobre (source, accession_number,
            # event_class).
            TODAY=$(date -u +%Y-%m-%d)
            python -m pipeline.ingest.edgar_scraper --start "$YESTERDAY" --end "$TODAY"
          fi

      - name: Backfill de precios del universo recién ingestado (solo en backfill)
        # SOLO en un backfill, y aquí dentro en vez de en el job paralelo
        # price_backfill_manual, por una cuestión de ORDEN: ese job corre en
        # paralelo a este, así que en un arranque en frío descargaría precios
        # de un universo todavía vacío (se vio en el run 34869580667: los
        # precios corrieron a las 16:35 y los eventos entraron a las 16:37).
        # Los pasos siguientes (CAR, enrichment, backtest) necesitan precios
        # YA cargados para los tickers que acaban de aparecer.
        if: github.event.inputs.backfill_start != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Universo + series de referencia (SPY, ^VIX, ETFs sectoriales) que
          # enrichment.py necesita para beta, VIX y sector_mood — antes nunca
          # se descargaban y esos tres datos salían vacíos en todos los eventos.
          python -m pipeline.ingest.universe_maintenance --tickers-file /tmp/tickers.txt
          # Rango de precios EXPLÍCITO, no el default del script
          # (config.BACKTEST_START/END, que termina en 2025-12-31 y dejaría sin
          # precios cualquier evento posterior a esa fecha). Hace falta:
          #  - hacia atrás: ~500 días naturales antes del primer evento, porque
          #    compute_car() ajusta el modelo de factores sobre una ventana de
          #    estimación de 250 DÍAS DE MERCADO previos al evento.
          #  - hacia delante: hasta hoy, para tener los D+1..D+20 de los
          #    eventos más recientes.
          PRICE_START=$(date -u -d "${{ github.event.inputs.backfill_start }} -500 days" +%Y-%m-%d)
          PRICE_END=$(date -u +%Y-%m-%d)
          echo "Precios: $PRICE_START -> $PRICE_END"
          python -m pipeline.ingest.yfinance_backfill --tickers /tmp/tickers.txt --start "$PRICE_START" --end "$PRICE_END"

      - name: Actualizar precios del universo (solo en la pasada nocturna)
        # BUG QUE ESTO CORRIGE: hasta ahora NINGUNA pasada programada
        # descargaba precios — price_backfill_manual solo corre con
        # workflow_dispatch. Sin esto, los precios de D+1..D+20 POSTERIORES a
        # cada evento no llegaban nunca, así que compute_car() se quedaba sin
        # poder cerrar ningún evento reciente y el backtest nunca acumulaba
        # trades por mucho que el pipeline corriese cada noche.
        #
        # Ventana de 500 días naturales hacia atrás, no solo los últimos días:
        # cada evento nuevo puede traer un ticker que el universo no tenía, y
        # ese ticker necesita los 250 DÍAS DE MERCADO de ventana de estimación
        # que pide el modelo de factores. Con una ventana corta, el CAR de las
        # empresas nuevas fallaría en silencio.
        #
        # Solo en la pasada nocturna (y en las manuales): yfinance es la etapa
        # lenta y frágil del pipeline (ARCHITECTURE_LEAN.md §7) y los precios
        # DIARIOS no cambian entre la apertura y el cierre.
        if: github.event.schedule != '30 14 * * 1-5' && github.event.schedule != '30 21 * * 1-5' && github.event.inputs.backfill_start == ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Universo + series de referencia (ver el paso de backfill).
          python -m pipeline.ingest.universe_maintenance --tickers-file /tmp/tickers.txt
          if [ -s /tmp/tickers.txt ]; then
            PRICE_START=$(date -u -d "500 days ago" +%Y-%m-%d)
            PRICE_END=$(date -u +%Y-%m-%d)
            echo "Precios: $PRICE_START -> $PRICE_END"
            python -m pipeline.ingest.yfinance_backfill --tickers /tmp/tickers.txt --start "$PRICE_START" --end "$PRICE_END"
          else
            echo "Universo vacío todavía — nada que descargar"
          fi

      - name: Extraer texto de filings pendientes (Fase 3 — insumo de Bull/Bear/novelty)
        # Va justo después de la ingesta EDGAR y ANTES del análisis: sin esto,
        # adversarial_analyzer.py degrada al placeholder y novelty.py no puede
        # calcular has_prior_guidance/rumor_flag (ver filing_text.py).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        # --limit 1000: con el default de 200, un backfill de ~25k eventos
        # tardaba semanas en tener texto, y sin texto la IA no los analiza.
        # A 8 req/s son ~2-3 minutos por pasada.
        run: python -m pipeline.ingest.filing_text --limit 1000

      - name: Ingesta factores Fama-French (barato, se puede refrescar cada noche)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.ingest.fama_french

      - name: Ingesta de cuentas anuales (XBRL de la SEC — análisis de largo plazo)
        # Insumo del análisis fundamental: los mismos números que venden los
        # proveedores de pago, publicados gratis por la SEC en XBRL. Un fallo
        # por empresa no aborta el resto (ver ingest_universe_fundamentals).
        #
        # Solo en la pasada nocturna: es una petición HTTP por empresa del
        # universo entero, y las cuentas anuales cambian cuatro veces al año,
        # no tres veces al día.
        if: github.event.schedule != '30 14 * * 1-5' && github.event.schedule != '30 21 * * 1-5'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: python -m pipeline.ingest.xbrl_fundamentals

      - name: Notas de calidad de negocio (análisis fundamental)
        # Va DESPUÉS de la ingesta de cuentas y del backfill de precios:
        # necesita ambas (las cuentas para los 4 criterios de negocio, el
        # precio para el de valoración). Solo nocturna, como su insumo.
        if: github.event.schedule != '30 14 * * 1-5' && github.event.schedule != '30 21 * * 1-5'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.analyze.quality_score

      - name: Lista de empresas — capitalización, liquidez y universo invertible
        # Calcula universe.market_cap_last_usd / adv_usd_60d /
        # in_investable_universe, que existían en el schema pero nunca se
        # rellenaban. El análisis con IA de más abajo usa esto para priorizar
        # empresas grandes y no gastar en micro-caps. Barato (una sentencia
        # SQL): corre en todas las pasadas. --list 25 deja en el log las 25
        # mayores y cuántos eventos tienen pendientes.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.ingest.universe_maintenance --list 25

      - name: Calcular CAR de eventos pendientes (insumo de historical_analogues.py)
        # Sin este paso, analyze/historical_analogues.py siempre vería
        # n_analogues=0 — car_results no se llena solo (ver su docstring).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.backtest.populate_car_results

      - name: Análisis de eventos (Fase 2 — Etapas 1-8, event_analysis_pipeline.py)
        # Reemplaza al script de la Fase 1 (adversarial_analyzer.py --smoke-test),
        # que ya no escribe en la base de datos por sí solo — ahora es el
        # orquestador quien llama a Bull/Bear/Judge y combina el resultado con
        # enrichment/novelty/impact/EV/abstention antes de guardar en event_analyses.
        #
        # Sin saldo en la cuenta de Anthropic, el paso NO falla: deja un aviso
        # (::warning::) con cuántos eventos esperan en cola y cuánto costarían,
        # y la primera corrida con fondos los procesa sola.
        #
        # Palancas sin tocar código (Settings > Secrets and variables >
        # Actions > Variables):
        #   ANALYSIS_MIN_MARKET_CAP_USD — p. ej. 10000000000 para analizar
        #     solo empresas de más de 10.000 M$ (por defecto, 300 M$).
        #   ANALYSIS_MAX_EVENTS_PER_RUN — tope de gasto por corrida
        #     (por defecto 500 eventos, ~5,5 $).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_MIN_MARKET_CAP_USD: ${{ vars.ANALYSIS_MIN_MARKET_CAP_USD }}
          ANALYSIS_MAX_EVENTS_PER_RUN: ${{ vars.ANALYSIS_MAX_EVENTS_PER_RUN }}
        run: python -m pipeline.analyze.event_analysis_pipeline

      # Estos tres pasos NO usan la IA: trabajan sobre lo que ya hay en la base
      # de datos. Con '!cancelled()' se ejecutan aunque el análisis de eventos
      # haya fallado (por ejemplo por falta de ANTHROPIC_API_KEY), en vez de
      # caerse con él. El run sigue marcándose como fallido — lo que no se
      # pierde es el resto del trabajo.
      - name: Backtest de cartera (3 versiones — portfolio_simulator.py)
        if: ${{ !cancelled() }}
        # Corre las 3 versiones sobre TODOS los eventos con trade_decision de
        # event_analyses. Es acumulativo por diseño de simulate_portfolio
        # (usa fetch_events_for_version, no filtra por "nuevos desde ayer"),
        # así que reejecutarlo cada noche recalcula la cartera completa con
        # el run_batch_tag del día — no es incremental como los pasos previos.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.backtest.portfolio_report

      - name: Validación estadística (Fase 6 — event study, sensibilidad, veredicto)
        if: ${{ !cancelled() }}
        # Reutiliza el portfolio_report que acaba de guardar el paso anterior
        # (mismo run_batch_tag fecha+sha) — no resimula la cartera. Guarda en
        # validation_reports (Postgres), no en docs/VALIDATION_REPORT.md: un
        # runner de GitHub Actions es efímero y este repo no hace commits
        # automáticos, así que un fichero escrito aquí se perdería al acabar
        # el job (mismo motivo por el que price_backfill_manual no escribe
        # nada a disco tampoco). Ver pipeline/validation/report.py:persist_validation_report.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.validation.report --persist-only

      - name: Paper trading semanal (Fase 4 — paper_trading/report.py)
        if: ${{ !cancelled() }}
        # Simula la última semana COMPLETA de datos disponibles como si
        # fuera "futura" (select_simulation_week en paper_trading/simulator.py).
        # A diferencia del backtest de cartera, esto SÍ tiene estado
        # incremental real: una posición sin resolver queda OPEN y se
        # recalcula (y puede cerrarse) la próxima vez que corra este mismo
        # step con más días de precio ya cargados — por eso corre cada
        # noche con el MISMO run_batch_tag por semana simulada, no uno
        # nuevo cada día (ver select_simulation_week: la fecha de hoy
        # decide la semana, no el run_batch_tag).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.paper_trading.report

  # El backfill de precios (yfinance) va en un job SEPARADO, manual, no en el
  # cron nocturno normal: es la etapa lenta y frágil (ARCHITECTURE_LEAN.md §7)
  # y solo hace falta ejecutarla una vez para el histórico, más incrementos
  # pequeños después. Lanzar con workflow_dispatch cuando haga falta.
  price_backfill_manual:
    # Excluido durante un backfill: ese caso lo cubre el paso equivalente
    # DENTRO de ingest_and_analyze, que sí corre en el orden correcto (después
    # de que la ingesta de EDGAR haya poblado universe). Este job corre en
    # paralelo, así que en un arranque en frío descargaría un universo vacío.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_start == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Backfill de precios (universo desde la tabla universe)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Universo + series de referencia (SPY, ^VIX, ETFs sectoriales) que
          # enrichment.py necesita para beta, VIX y sector_mood — antes nunca
          # se descargaban y esos tres datos salían vacíos en todos los eventos.
          python -m pipeline.ingest.universe_maintenance --tickers-file /tmp/tickers.txt
          python -m pipeline.ingest.yfinance_backfill --tickers /tmp/tickers.txt
